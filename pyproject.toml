[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-pointer"
version = "0.5.2"
description = "A Windows floating context launcher for Codex"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = ["PySide6==6.7.0"]

[project.gui-scripts]
codex-pointer = "codex_pointer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_pointer = ["assets/*", "assets/**/*"]
